[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "face-analyzer"
version = "1.0.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"face_analyzer.ui" = ["theme.css", "sample_photo.jpg", "fonts/*"]
"face_analyzer.nets.mivolo" = ["LICENSE_MIVOLO"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Read by pyright and basedpyright (CI's type check, docs/ci.md). No venv setting: CI passes
# --pythonpath, and a missing venv is a configuration error. A personal pyrightconfig.json can
# point an editor at .venv; `-p pyproject.toml` keeps it from changing CI's result.
[tool.pyright]
include = ["src", "tests", "tools", "streamlit_app.py"]
# Vendored upstream networks (also excluded from ruff).
exclude = ["src/face_analyzer/nets", "**/__pycache__", ".venv*", ".worktrees", "data", "tmp", "ideas"]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/face_analyzer/nets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["face_analyzer"]
branch = true
# Relative paths let CI combine and publish reports from any checkout location.
relative_files = true
omit = ["*/face_analyzer/nets/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Fail below this total: a floor just under the measured 65%, raised as tests are added.
fail_under = 63
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
