# Weekly dependency updates. Minor/patch bumps are grouped into one PR per
# ecosystem and merge themselves once CI is green (dependabot-automerge.yml);
# major bumps arrive as individual PRs for separate review. The 7-day cooldown keeps a
# release out until it has been public for a week (a compromised release is usually caught
# by then); security updates ignore it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    labels: [dependencies, "area: ci"]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    labels: [dependencies, python]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # OpenCV 5 removed the dnn Caffe importer, which loads the caffe age/gender, dex and
      # eccv16 colorization models (pipeline/loader.py). Stay on 4.x until those are ported.
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The base image's Python is a deliberate pin (3.11, matched by CI and the dev container),
      # and the optional torch/tensorflow/onnxruntime pins must have wheels for it. Docker tags
      # make 3.11 -> 3.x look like a minor bump, so move it by hand together with those pins.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
