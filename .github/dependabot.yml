# Weekly dependency updates. Minor/patch bumps are grouped into one PR per
# ecosystem; major bumps arrive as individual PRs for separate review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # OpenCV 5 removed the dnn Caffe importer, which loads the caffe age/gender, dex and
      # eccv16 colorization models (pipeline/loader.py). Stay on 4.x until those are ported.
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The base image's Python is a deliberate pin (3.11, matched by CI and the dev container),
      # and the optional torch/tensorflow/onnxruntime pins must have wheels for it. Docker tags
      # make 3.11 -> 3.x look like a minor bump, so move it by hand together with those pins.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
