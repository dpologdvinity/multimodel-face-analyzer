# Labels each pull request by the areas it touches (.github/labeler.yml), so the PR list shows
# at a glance which ones change models, the UI, the demo or CI.
# pull_request_target lets fork PRs be labeled too. That is safe here: the job never checks out
# or runs the pull request's code; the labeler reads only the file list and the base branch's
# config through the API.
name: Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, API-only job
    branches: [master]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
