# The merge gate. Every pull request and every push to master runs:
#   lint     ruff (annotated inline on the diff), ruff format, typos, and the basedpyright ratchet
#   test     the full suite on Python 3.11 and 3.12 with branch coverage and a coverage floor,
#            then a check that the run left the tracked files unchanged
#   browser  the public demo, installed exactly as Streamlit Community Cloud installs it, driven
#            in Chromium: sample photo analyzed, both themes screenshotted
#   audit    pip-audit of requirements.txt against the PyPI advisory database
#   ci-ok    one check that is green only when every job above is (branch protection needs it)
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same pull request cancels the run in progress; master runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The github format turns each finding into an inline annotation on the pull request diff.
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .
      - name: typos
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      # The ratchet: .basedpyright/baseline.json records the errors that predate this check, so
      # only a new error fails here. The second step fails when an error was fixed but the
      # baseline still lists it, so the count can only go down.
      - name: basedpyright (no new type errors)
        run: basedpyright -p pyproject.toml --pythonpath "$(command -v python)"
      - name: basedpyright baseline is current
        run: |
          basedpyright -p pyproject.toml --pythonpath "$(command -v python)" --writebaseline > /dev/null
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::error file=.basedpyright/baseline.json::Type errors were fixed: run 'tools/typecheck.sh --writebaseline' and commit the smaller baseline."
            git diff --stat -- .basedpyright/baseline.json
            exit 1
          fi
          {
            echo "### Type-check ratchet"
            echo "$(grep -c '"code"' .basedpyright/baseline.json) baselined errors left to fix; no new ones."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Only the required files are downloaded (the SSD detector, ~3 MB), so the app smoke tests
      # run; the optional weights are multiple GB and tests that need them skip when missing.
      - run: python tools/fetch_models.py --keys
      - name: pytest
        run: >-
          python -m pytest -q -ra
          --cov --cov-report=term --cov-report=xml
          --junitxml=junit.xml
      - name: Test report
        if: ${{ !cancelled() }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: junit.xml
      - name: Coverage summary
        if: ${{ !cancelled() }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          {
            echo "### Coverage (Python $PYTHON_VERSION)"
            python -m coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
      # A test that rewrites a tracked file (a fixture regenerated, a bundled model config touched)
      # would pass here and silently change the next run, so fail on any change.
      - name: Tests left the tree clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::The test run changed tracked files; tests must not rewrite fixtures or configs."
            git status --short
            git diff --stat
            exit 1
          fi
      - name: Keep the coverage data for the pull request comment
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 7

  browser:
    name: browser (public demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-e2e.txt
      # Exactly what Streamlit Community Cloud runs (no editable install, no dev extras), so a
      # requirement that only resolves with the dev pins, or drags mediapipe in, fails here first.
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-e2e.txt
      # The key hashes every tracked file in models/ (the manifest and the bundled configs), so a
      # pull request that edits a config never gets the old copy back from the cache.
      - name: Cache the demo weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: demo-weights-${{ hashFiles('models/**') }}
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements-e2e.txt') }}
      - name: Install Chromium
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
        env:
          CACHE_HIT: ${{ steps.chromium.outputs.cache-hit }}
      - name: Serve the demo
        run: |
          nohup streamlit run streamlit_app.py --server.headless=true --server.port=8501 \
            > streamlit.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          cat streamlit.log
          exit 1
      - name: Drive it in Chromium
        run: python -m pytest -q -ra tests/test_browser_smoke.py
        env:
          FACE_ANALYZER_E2E_URL: http://localhost:8501
          FACE_ANALYZER_E2E_SHOTS: screenshots
      - name: Screenshots in the run summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Public demo in Chromium"
            echo "The Night and Day screenshots are in the **demo-screenshots** artifact of this run."
            echo
            echo '<details><summary>Server log (last 40 lines)</summary>'
            echo
            echo '```'
            tail -n 40 streamlit.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: demo-screenshots
          path: |
            screenshots/
            streamlit.log
          retention-days: 14

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # requirements.txt is what the demo and the Docker image ship; the dev pins never deploy.
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          summary: true

  coverage:
    name: coverage report
    needs: test
    # Dependabot and fork pull requests get a read-only token, so they skip the comment; the
    # coverage floor already ran in the test job.
    # It reports on pull requests and records master pushes; other events have nothing to report.
    if: >-
      contains(fromJSON('["push", "pull_request"]'), github.event_name) &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Comments the coverage of the changed lines on a pull request; on master it stores the
    # total and the README badge on the python-coverage-comment-action-data branch.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
      - uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, browser, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
