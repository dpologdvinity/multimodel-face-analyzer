# Automatic Claude Code review of every ready, same-repository pull request, against this repo's
# own rules rather than generic style: the AGENTS.md invariants and the README's Responsible use
# section. Findings arrive as inline comments plus one summary comment that is updated on each
# push. Formatting, lint and types are CI's job, so the review skips them. Does nothing until
# the CLAUDE_CODE_OAUTH_TOKEN secret exists; Dependabot and fork PRs never get secrets.
name: Claude review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; see docs/ci.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Multimodel Face Analyzer. Read AGENTS.md and the
            README's "Responsible use" section first; they are the rules to review against.
            Check, most serious first:
            1. Responsible use: age, gender, race and emotion presented as appearance-based
               guesses, never facts; no new way to identify, track or profile people
               (recognition or search paths, cross-photo tracking, exporting face data);
               storing a face stays an explicit action and stays off in demo mode.
            2. Demo mode: anything that persists or shares faces is gated on is_demo_mode();
               the demo loads only the DEMO_MODELS allowlist.
            3. Model honesty: a feature whose weights are absent or known-bad must not appear
               to work; files are checked through load_models() / _present(), not .exists().
               Weights stay out of git and in models/manifest.json.
            4. tests/fixtures/golden_analysis.json changes only for an intended behavior change
               that the description explains.
            5. requirements.txt still installs with a plain pip install on Streamlit Community
               Cloud (no mediapipe); pins resolve on Python 3.11 and 3.12.
            6. Correctness and edge cases in the changed code, missing tests for new logic or
               a bug fix, and docs (README, ARCHITECTURE, AGENTS.md, docs/) left stale.
            Skip formatting, lint and type errors: CI checks those. Use inline comments for
            specific lines and one short summary comment; say plainly when nothing needs
            changing. Do not approve or request changes.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
