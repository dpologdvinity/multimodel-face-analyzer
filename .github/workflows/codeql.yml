# CodeQL security analysis of the Python package, tools and tests, and of the workflow files
# themselves, on every change and weekly (new queries catch old code). Findings land in the
# Security tab rather than failing the pull request.
name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "models/**", "LICENSE"]
  pull_request:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "models/**", "LICENSE"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          # Vendored third-party networks (src/face_analyzer/nets) are upstream code, kept as is.
          config: |
            paths-ignore:
              - src/face_analyzer/nets
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
