# Lints the workflow files themselves (syntax, expressions, and shellcheck on every run: block),
# so a broken workflow fails its pull request instead of silently not running on master.
name: actionlint

on:
  push:
    branches: [master]
    paths: [".github/workflows/**"]
  pull_request:
    branches: [master]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image bundles shellcheck and pyflakes; pinned by digest.
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
