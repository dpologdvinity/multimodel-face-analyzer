# Mention @claude in an issue, a pull request comment or a review, and Claude Code answers,
# reviews, or pushes a branch with a fix. It works from the checkout, so it follows AGENTS.md
# (through CLAUDE.md) like any agent in this repo. Runs on the owner's Claude subscription
# through the CLAUDE_CODE_OAUTH_TOKEN secret and does nothing until that secret exists.
# The repo is public, so only the owner can start a run; the action also refuses senders
# without write access and pull requests from forks.
name: Claude

on:
  # Every trigger is gated on the sender being the repository owner (the job condition).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One run per issue or PR at a time; a second mention waits rather than cancelling work.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The action trades the run's OIDC token for the Claude GitHub App's short-lived token.
      id-token: write
      # Lets it read CI results when asked why a check failed.
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; see docs/ci.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          additional_permissions: |
            actions: read
          claude_args: >-
            --append-system-prompt "Follow AGENTS.md. Work on a branch named <type>/<topic>,
            never push to master, and use Conventional Commits for commits and pull request titles."
