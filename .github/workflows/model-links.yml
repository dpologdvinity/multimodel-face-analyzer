name: Model links

# Upstream model files live in third-party repos that can disappear (a deleted repo breaks every
# Docker build that selects the model). Probe each manifest URL with a one-byte range request:
# weekly, on demand, and whenever a pull request changes the manifest.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - models/manifest.json
      - tests/test_manifest_urls.py

concurrency:
  group: model-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The check needs only pytest; tools/fetch_models.py is stdlib-only.
      - run: pip install "$(grep '^pytest==' requirements-dev.txt)"
      - run: python -m pytest -q tests/test_manifest_urls.py
        env:
          FACE_ANALYZER_NETWORK_TESTS: "1"
      # A weekly failure means an upstream model file moved or vanished: keep one issue open.
      - name: Report the failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          .github/scripts/report-issue.sh "ci: a model download link is broken"
          "The weekly probe of models/manifest.json found an unreachable URL: $RUN_URL.
          See docs/setup.md#adding-or-changing-a-model-file."
          bug "area: models"
